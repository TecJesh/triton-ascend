    - name: Compute Patch Hash
      shell: bash
      run: |
        PATCH_DIR="third_party/ascend/patch"
        if [ -d "${PATCH_DIR}" ] && find "${PATCH_DIR}" -maxdepth 1 -type f -name 'llvm_patch_*.patch' -print -quit | grep -q .; then
          PATCH_HASH=$(
            LC_ALL=C find "${PATCH_DIR}" -maxdepth 1 -type f -name 'llvm_patch_*.patch' -print0 \
              | sort -z \
              | xargs -0 cat \
              | sha256sum \
              | cut -d' ' -f1 \
              | cut -c1-8
          )
        else
          PATCH_HASH="00000000"
        fi
        echo "Patch hash: ${PATCH_HASH}"
        echo "patch_hash=${PATCH_HASH}" >> ${GITHUB_ENV}

        INSTALL_DIR="llvm-${{ env.short_llvm_commit_hash }}-${PATCH_HASH}-${{ matrix.config.target-os }}-${{ matrix.config.arch }}-${{ env.llvm_build_number }}"
        echo "LLVM installation directory name: ${INSTALL_DIR}"
        echo "llvm_install_dir=${INSTALL_DIR}" >> ${GITHUB_ENV}

    - name: Check LLVM Build Does Not Exist
      shell: bash
      run: |
        URL="https://oaitriton.blob.core.windows.net/public/llvm-builds/${{ env.llvm_install_dir }}.tar.gz"
        HTTP_STATUS="$(curl --head --silent --show-error --output /dev/null --write-out "%{http_code}" "${URL}")"
        if [ "${HTTP_STATUS}" != "404" ]; then
          echo "LLVM build already exists or could not be checked: ${URL} returned ${HTTP_STATUS}"
          exit 1
        fi

