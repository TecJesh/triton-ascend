    - name: Setup obsutil and upload to OBS
      if: github.event_name == 'push' && github.repository == 'triton-lang/triton-ascend'
      shell: bash
      env:
        AK: ${{ secrets.OBS_AK }}
        SK: ${{ secrets.OBS_SK }}
        ARCH: ${{ matrix.config.arch == 'x64' && 'amd64' || 'arm64' }}
      run: |
        set -eu
        if [ -z "${AK}" ] || [ -z "${SK}" ]; then
          echo "OBS credentials are empty."
          exit 1
        fi
        curl -fL "https://obs-community.obs.cn-north-1.myhuaweicloud.com/obsutil/current/obsutil_linux_${ARCH}.tar.gz" -o obsutil.tar.gz
        gzip -t obsutil.tar.gz || { echo "obsutil.tar.gz is not a valid gzip"; exit 1; }
        tar xzf obsutil.tar.gz
        rm -f obsutil.tar.gz
        mv obsutil_linux_* obsutil

        obsutil/obsutil config -i="${AK}" -k="${SK}" -e=https://obs.cn-southwest-2.myhuaweicloud.com
        obsutil/obsutil cp -u "${{ env.llvm_install_dir }}.tar.gz" obs://triton-ascend-artifacts/llvm-builds/

    - name: Azure login
      if: ${{ (github.repository == 'triton-lang/triton') && github.ref_name == 'main' }}
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID_LLVM }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID_LLVM }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID_LLVM }}

    - name: Upload LLVM Artifacts to Azure
      if: ${{ (github.repository == 'triton-lang/triton') && github.ref_name == 'main' }}
      shell: bash -el {0}
      run: |
        sha256sum "${{ env.llvm_install_dir }}.tar.gz"

        az storage blob upload --account-name oaitriton --auth-mode login --container-name public --file "${{ env.llvm_install_dir }}.tar.gz" --name "llvm-builds/${{ env.llvm_install_dir }}.tar.gz"

        URL=$(az storage blob url --account-name oaitriton --auth-mode login --container-name public --name "llvm-builds/${{ env.llvm_install_dir }}.tar.gz")
        echo "Blob URL: ${URL}"

    - name: Azure Logout
      if: ${{ (github.repository == 'triton-lang/triton') && github.ref_name == 'main' }}
      run: |
        az logout
        az cache purge
        az account clear

    - name: Dump Sccache Statistics
      run: sccache --show-stats
