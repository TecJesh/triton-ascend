# GitHub Actions workflow: Sync upstream Triton into triton-ascend fork
#
# Place this file in YOUR TRITON-ASCEND FORK REPO at:
#   .github/workflows/sync-upstream.yml
#
# Required GitHub Secret (Settings → Secrets and variables → Actions):
#   ANTHROPIC_API_KEY  — DeepSeek API key (used via Anthropic-compatible API)
#
# The workflow:
#   1. Checks out your triton-ascend fork
#   2. Adds & fetches upstream-triton remote (triton-lang/triton)
#   3. Clones & installs TA_main2main_workflow
#   4. Runs ta-kickoff → merge → AI resolve conflicts → build → test
#   5. Pushes work branch + creates PR targeting main

name: Sync Upstream Triton

on:
  # schedule:
  #   # Run daily at 2:00 AM UTC
  #   - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      target_commit:
        description: 'Specific upstream triton commit SHA (leave empty for latest)'
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write

jobs:
  sync-upstream:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      # ── 1. Checkout triton-ascend fork ──────────────────────────────────────
      - name: Checkout triton-ascend
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      # ── 2. Configure git user and push access ──────────────────────────────
      - name: Configure git
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name  "TA Sync Bot"
          git config --global user.email "ta-sync-bot@users.noreply.github.com"
          # Authenticate gh CLI
          echo "${TOKEN}" | gh auth login --with-token
          # Let gh CLI handle git auth (works for HTTPS + both SSH formats)
          gh auth setup-git
          # Verify
          echo "=== gh auth ===" && gh auth status
          echo "=== git auth ===" && git ls-remote origin HEAD | head -1

      # ── 3. Set up upstream remotes ──────────────────────────────────────────
      - name: Add upstream remotes
        run: |
          if ! git remote get-url upstream-triton 2>/dev/null; then
            git remote add upstream-triton https://github.com/triton-lang/triton.git
          fi
          git fetch upstream-triton --prune

      # ── 4. Install Python ───────────────────────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # ── 5. Install TA_main2main_workflow ─────────────────────────────────────
      - name: Install TA_main2main_workflow
        run: |
          git clone https://github.com/TecJesh/main2main_workflow.git /tmp/ta-workflow
          cd /tmp/ta-workflow/
          pip install -e .
          echo "TA workflow installed: $(ta-kickoff --help 2>&1 | head -1)"
          pip install pre-commit

      # ── 6. Install Claude Code (AI backend) ─────────────────────────────────
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code 2>/dev/null || echo "Claude Code install skipped (pre-installed)"

      # ── 7. Resolve target commit ────────────────────────────────────────────
      - name: Set target commit
        id: target
        run: |
          if [ -n "${{ github.event.inputs.target_commit }}" ]; then
            echo "COMMIT=${{ github.event.inputs.target_commit }}" >> $GITHUB_OUTPUT
          else
            echo "COMMIT=$(git rev-parse upstream-triton/main)" >> $GITHUB_OUTPUT
          fi
          echo "Target: ${COMMIT:-unknown}"

      # ── 8. Run sync ─────────────────────────────────────────────────────────
      - name: Debug git config
        run: |
          echo "=== Global gitconfig ==="
          cat ~/.gitconfig 2>/dev/null || echo "(none)"
          echo "=== origin remote ==="
          git remote -v
          echo "=== git push dry-run ==="
          git push --dry-run origin HEAD 2>&1 || true
          echo "=== gh auth status ==="
          gh auth status 2>&1 || true

      - name: Run main2main sync
        env:
          TRITON_ASCEND_PATH: ${{ github.workspace }}
          TRITON_PATH: ${{ github.workspace }}
          TRITON_TARGET_COMMIT: ${{ steps.target.outputs.COMMIT }}

          # AI backend (DeepSeek via Anthropic-compatible API)
          AI_BACKEND: claude
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_BASE_URL: https://api.deepseek.com/anthropic
          ANTHROPIC_MODEL: deepseek-v4-pro[1m]
          ANTHROPIC_DEFAULT_OPUS_MODEL: deepseek-v4-pro[1m]
          ANTHROPIC_DEFAULT_SONNET_MODEL: deepseek-v4-pro[1m]
          ANTHROPIC_DEFAULT_HAIKU_MODEL: deepseek-v4-flash
          CLAUDE_CODE_SUBAGENT_MODEL: deepseek-v4-flash
          CLAUDE_CODE_EFFORT_LEVEL: max

          # PR creation
          PUSH_TO_GITHUB: "true"
          GITHUB_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          # Skip build & test on CI (no NPU)
          SKIP_BUILD: "true"
          SKIP_E2E_TEST: "true"

          AUTO_STASH: "true"

          PR_AUTHOR: TA
          PR_TYPE: sync
        run: |
          ta-kickoff 2>&1 | tee /tmp/ta-output.log
          if grep -qE "✘|Failed|failed|error" /tmp/ta-output.log; then
            echo "::error::ta-kickoff reported failure. See log above."
            exit 1
          fi

      # ── 9. Report failure ──────────────────────────────────────────────────
      - name: Report failure
        if: failure()
        run: |
          echo "::error::Sync workflow failed."
          echo "Debug info:"
          echo "  - ta-kickoff log: /tmp/ta-output.log"
          echo "  - workspace artifacts: uploaded below"

      # ── 10. Upload workspace artifacts (for debugging) ──────────────────────
      - name: Upload sync artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sync-workspace
          path: |
            /tmp/ta-workflow/workspace/
          retention-days: 7
